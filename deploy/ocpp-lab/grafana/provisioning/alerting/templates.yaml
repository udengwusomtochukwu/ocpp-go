# hyde/lab: custom Teams notification templates. Clean layout, severity-aware,
# action-forward, and NO silence/footer links. Critical is loud and states that
# it repeats until resolved.
apiVersion: 1
templates:
  - orgId: 1
    name: hyde
    template: |
      {{ define "hyde.subject" -}}
      {{ if eq .CommonLabels.severity "critical" }}🚨 CRITICAL · ACTION REQUIRED — {{ .CommonLabels.alertname }}
      {{- else if eq .CommonLabels.severity "warning" }}⚠️ WARNING — {{ .CommonLabels.alertname }}
      {{- else }}ℹ️ {{ .CommonLabels.alertname }}{{ end }}
      {{- end }}

      {{ define "hyde.body" -}}
      {{ range .Alerts -}}
      {{ if eq .Status "resolved" }}✅ **RESOLVED** — {{ .Annotations.summary }}

      {{ continue }}{{ end -}}
      {{ if eq .Labels.severity "critical" -}}
      🚨 **Critical charger alert — please take a look**

      **{{ .Annotations.summary }}**

      👉 [**Acknowledge — I'm looking into it**](https://ocpp-lab.hydecharge.com/api/alerts/ack?alertname={{ .Labels.alertname | urlquery }})

      PEAK250 · A2111LHE0212606001 · **{{ .Labels.category }}** · {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}

      _These reminders repeat until someone taps Acknowledge above, or the issue clears._
      {{- else if eq .Labels.severity "warning" -}}
      ⚠️ **{{ .Annotations.summary }}**

      **Action:** {{ .Annotations.action }}

      PEAK250 · category **{{ .Labels.category }}** · fired {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}
      {{- else -}}
      ℹ️ {{ .Annotations.summary }}

      _{{ .Labels.category }} · {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}_
      {{- end }}
      {{ end -}}
      {{- end }}
