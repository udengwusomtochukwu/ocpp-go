# hyde/lab — isolated ocpp-go 1.6 evaluation lab.
#
# LIVE vs SIM: the internal charge-point sim sits behind the "sim" compose
# profile, so a plain `up` (what Dokploy runs) does NOT start it — the
# deployed stack only talks to real hardware unless a sim connects
# externally. To run the sim locally:
#   docker-compose -f deploy/ocpp-lab/docker-compose.yml --profile sim up --build
#
# Local (no sim): docker-compose -f deploy/ocpp-lab/docker-compose.yml up --build
# Dokploy: deployed as a Compose service; a domain is attached to the
#          central-system service on port 8887 (TLS terminated at Traefik).
#
# NOTE: build contexts point at the repo root (../..) because the Dockerfiles
# do `COPY . .` + `go mod download` against the whole module. Upstream's
# example/1.6/docker-compose.yml uses stale relative paths — this one is fixed.
services:
  central-system:
    build:
      context: ../..
      dockerfile: example/1.6/cs/Dockerfile
    image: hyde/ocpp1.6-central-system:lab
    container_name: ocpp-lab-cs
    environment:
      - SERVER_LISTEN_PORT=8887
      - LOG_LEVEL=info
      - HEARTBEAT_INTERVAL=60
      - METRICS_PORT=2112              # OTel/Prometheus /metrics (pull)
      - OTLP_ENDPOINT=otel-collector:4317  # OTLP traces (push) -> collector
      - API_PORT=8080                  # REST/SSE surface (Traefik path route /api)
      - PUBLIC_WS_URL=wss://ocpp-lab.hydecharge.com  # advertised charger endpoint
      - TSDB_DSN=postgres://ocpplab:ocpplab@timescale:5432/ocpplab?sslmode=disable  # raw meter samples -> Timescale
      - LIVE_CHARGER_IDS=A2111LHE0212606001  # allowlist: real hardware; every other id is classified sim
      - SCHEDULED_RESET_AT=04:00        # daily idle-aware reset (UTC = 06:00 CEST); empty disables
      - SCHEDULED_RESET_TYPE=Soft       # Soft | Hard
      - SCHEDULED_RESET_GRACE_MIN=30    # wait this long for an idle window before skipping
    depends_on:
      timescale:
        condition: service_started
    # No host port publish: Traefik (on dokploy-network) is the ingress.
    networks:
      - sim
      - dokploy-network
    tty: true

  # Internal simulator — OFF by default (profile "sim"): Dokploy's plain
  # `up` skips profiled services, so the deployed stack runs no always-on
  # sim polluting live data. Opt in locally with `--profile sim`.
  charge-point:
    profiles: ["sim"]
    depends_on:
      central-system:
        condition: service_started
    build:
      context: ../..
      dockerfile: example/1.6/cp/Dockerfile
    image: hyde/ocpp1.6-charge-point:lab
    container_name: ocpp-lab-cp
    environment:
      - CLIENT_ID=chargePointSim
      - CENTRAL_SYSTEM_URL=ws://central-system:8887
    networks:
      - sim
    tty: true

  # --- product data: raw per-session meter samples (ADR-0003 preview) ---
  # Every SampledValue the CS receives lands in the meter_samples hypertable
  # (written by example/1.6/cs/tsdb.go); Grafana reads it via the `timescale`
  # datasource for the "OCPP Sessions (lab)" dashboard. Ops metrics stay in
  # Prometheus — product-data plane and ops plane are deliberately separate.
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: ocpp-lab-timescale
    environment:
      - POSTGRES_USER=ocpplab
      - POSTGRES_PASSWORD=ocpplab
      - POSTGRES_DB=ocpplab
    volumes:
      - timescale-data:/var/lib/postgresql/data
      # First-boot schema (hypertable + index); tsdb.go re-applies it
      # idempotently at CS boot, so a stale volume still converges.
      - ./timescale-init.sql:/docker-entrypoint-initdb.d/10-meter-samples.sql:ro
    networks:
      - sim

  # --- observability: scrape the CS registry metrics + visualize ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ocpp-lab-prometheus
    environment:
      - PROMCFG=selfscrape-v1  # bump to force a recreate when prometheus.yml changes (bind-mount edits alone don't)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 7d comfortably covers the Operations dashboard's 24h default (and any
      # week view); at a 5s scrape of this small series set it stays tiny.
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Metrics history survives container recreates/redeploys (it previously
      # died with the container — the TSDB lived in the writable layer).
      - prometheus-data:/prometheus
    networks:
      - sim

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: hyde/ocpp-lab-grafana:lab
    container_name: ocpp-lab-grafana
    depends_on:
      - prometheus
    environment:
      # Served under a sub-path off the existing lab host (no extra DNS record).
      - GF_SERVER_ROOT_URL=https://ocpp-lab.hydecharge.com/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ocpplab
      - GF_USERS_DEFAULT_THEME=dark
      # HYDE-branded dashboard headers are HTML text panels (bold+light two-tone
      # word pairs); Grafana sanitizes inline HTML styles unless this is off.
      # Anonymous role stays Viewer, so panel HTML remains admin-authored only.
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      # Land visitors on the HYDE home dashboard (summary + directory), not the
      # stock "Welcome to Grafana" screen.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/hyde-home.json
    networks:
      - sim
      - dokploy-network

  # --- tracing: OTLP push pipeline (CS -> collector -> Jaeger) ---
  otel-collector:
    image: otel/opentelemetry-collector:0.109.0
    container_name: ocpp-lab-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - COLCFG=logs-v1   # bump to force a recreate when config.yaml changes (bind-mount edits alone don't)
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - sim

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ocpp-lab-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - QUERY_BASE_PATH=/jaeger
    networks:
      - sim
      - dokploy-network

  # log store: native OTLP ingest, queried by Grafana's Loki datasource
  loki:
    image: grafana/loki:3.1.1
    container_name: ocpp-lab-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - sim

networks:
  sim:
    driver: bridge
  # Provided by Dokploy; Traefik lives here and routes the attached domain to
  # central-system:8887. For a LOCAL run first: docker network create dokploy-network
  dokploy-network:
    external: true

volumes:
  # Raw meter samples survive redeploys (Dokploy recreates containers, not volumes).
  timescale-data:
  # Prometheus TSDB — 7d of ops metrics survive redeploys the same way.
  prometheus-data:
