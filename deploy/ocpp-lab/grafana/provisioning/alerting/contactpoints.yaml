# hyde/lab: Teams contact points. The webhook URL is injected from the
# TEAMS_WEBHOOK_URL env var (set as a Dokploy compose env — never in git).
# Two receivers share the URL: the events one suppresses resolved-messages
# so info-level session/boot events don't double-notify.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: hyde-teams
    receivers:
      - uid: hyde-teams-main
        type: teams
        settings:
          url: ${TEAMS_WEBHOOK_URL}
        disableResolveMessage: false
  - orgId: 1
    name: hyde-teams-events
    receivers:
      - uid: hyde-teams-events
        type: teams
        settings:
          url: ${TEAMS_WEBHOOK_URL}
        disableResolveMessage: true
  # warning + critical go to BOTH the channel and the Felix/Prince chat.
  - orgId: 1
    name: hyde-escalate
    receivers:
      - uid: hyde-escalate-channel
        type: teams
        settings:
          url: ${TEAMS_WEBHOOK_URL}
        disableResolveMessage: false
      - uid: hyde-escalate-chat
        type: teams
        settings:
          url: ${TEAMS_CHAT_WEBHOOK_URL}
        disableResolveMessage: false
