global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ocpp-central-system
    metrics_path: /metrics
    static_configs:
      - targets: ['central-system:2112']
        labels:
          service: ocpp-central-system
  # Self-scrape: makes retention/TSDB health queryable (prometheus_* series).
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
