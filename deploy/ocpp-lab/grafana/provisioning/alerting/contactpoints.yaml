# hyde/lab: Teams contact points. The webhook URLs are injected from env
# (TEAMS_WEBHOOK_URL / TEAMS_CHAT_WEBHOOK_URL) — Dokploy compose env, never in git.
# Each receiver uses the custom hyde templates (clean, severity-aware, no silence
# link). Two channel receivers (main + resolve-suppressed events); one escalate
# point that fans warning+critical to the channel AND the Felix/Prince chat.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: hyde-teams
    receivers:
      - uid: hyde-teams-main
        type: teams
        settings:
          url: ${TEAMS_WEBHOOK_URL}
          title: '{{ template "hyde.subject" . }}'
          message: '{{ template "hyde.body" . }}'
        disableResolveMessage: false
  - orgId: 1
    name: hyde-teams-events
    receivers:
      - uid: hyde-teams-events
        type: teams
        settings:
          url: ${TEAMS_WEBHOOK_URL}
          title: '{{ template "hyde.subject" . }}'
          message: '{{ template "hyde.body" . }}'
        disableResolveMessage: true
  # warning + critical go to BOTH the channel and the Felix/Prince chat.
  - orgId: 1
    name: hyde-escalate
    receivers:
      - uid: hyde-escalate-channel
        type: teams
        settings:
          url: ${TEAMS_WEBHOOK_URL}
          title: '{{ template "hyde.subject" . }}'
          message: '{{ template "hyde.body" . }}'
        disableResolveMessage: false
      - uid: hyde-escalate-chat
        type: teams
        settings:
          url: ${TEAMS_CHAT_WEBHOOK_URL}
          title: '{{ template "hyde.subject" . }}'
          message: '{{ template "hyde.body" . }}'
        disableResolveMessage: false
