# hyde/lab: severity-tagged OCPP event taxonomy — generated by build_alerts.py.
# Each rule carries labels {severity, category} + annotations {summary, action}.
apiVersion: 1
groups:
- orgId: 1
  name: ocpp-lab
  folder: OCPP Lab
  interval: 1m
  rules:
  - uid: ocpp-cs-down
    title: Central system down (scrape failing)
    condition: C
    for: 2m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
      category: service
    annotations:
      summary: The OCPP central system is not scrapeable — the backend is likely down.
      action: Check the ocpp-lab-cs container and redeploy if needed. Chargers cannot be monitored or controlled while this is firing.
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up{job="ocpp-central-system"}
        instant: true
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: ocpp-precharge-fault
    title: HCU precharge module fault (vendor 012900)
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      category: hardware
    annotations:
      summary: The recurring HCU Precharge Module Fault (vendor 012900) fired — it aborts customer sessions mid-charge.
      action: Take the unit out of service (change-availability Inoperative) and escalate to ZD with the incident report.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `charger fault` |~ `012900` [10m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-fault-storm
    title: Charger fault storm (3+ faults / 30m)
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      category: hardware
    annotations:
      summary: 3+ charger faults in 30 minutes — a recurring/degrading fault pattern (as in the 2026-07-24/26 precharge incident).
      action: Investigate the fault codes; consider taking the unit out of service pending vendor inspection.
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `charger fault` [30m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: ocpp-reboot-loop
    title: Charger reboot loop (3+ boots / 15m)
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      category: service
    annotations:
      summary: 3+ charger boots in 15 minutes — possible crash or reboot loop.
      action: Investigate power/network/firmware; consider taking the unit out of service.
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `boot confirmed` [15m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: ocpp-grid-overdraw
    title: Grid draw exceeded the site feed
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      category: grid
    annotations:
      summary: Measured grid draw exceeded the site feed ceiling (>46 kW vs 43.6 kW nominal at 63 A).
      action: Investigate — possible metering anomaly or a feed/config change; check demand-charge exposure.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: timescale
      model:
        refId: A
        datasource:
          type: postgres
          uid: timescale
        rawSql: SELECT max(GREATEST(value-100000,0)/1000.0)::float8 AS value FROM meter_samples WHERE connector_id=0 AND measurand='VWGC.ChargingStationCurrentImport' AND NOT is_sim AND ts > now() - interval
          '10 minutes'
        format: table
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 46
  - uid: ocpp-fault-spike
    title: Charger fault reported
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      category: hardware
    annotations:
      summary: One or more StatusNotifications carried an errorCode (a charger fault) in the last 5 min.
      action: Open the Operations dashboard → Faults for the vendor detail; watch for recurrence.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `charger fault` [5m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-short-session
    title: Charge aborted early (short + high power)
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      category: hardware
    annotations:
      summary: A charge ended abruptly while still drawing power (<2 min, >20 kW) — the fault-abort signature, not a normal finish.
      action: Check the charger's faults; if this recurs, it is likely the precharge fault — escalate to ZD.
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: timescale
      model:
        refId: A
        datasource:
          type: postgres
          uid: timescale
        rawSql: SELECT count(*)::float8 AS value FROM (SELECT transaction_id FROM meter_samples WHERE NOT is_sim AND transaction_id IS NOT NULL AND ts > now() - interval '15 minutes' GROUP BY transaction_id
          HAVING EXTRACT(EPOCH FROM (max(ts)-min(ts))) < 120 AND max(value*CASE WHEN unit='kW' THEN 1 ELSE 0.001 END) FILTER (WHERE measurand='Power.Active.Import') > 20) x
        format: table
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-command-failed
    title: Remote command failed / rejected
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      category: control
    annotations:
      summary: A remote command to the charger was rejected or failed in the last 10 min.
      action: Check which command on the Operations dashboard; retry, or investigate the charger state.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum(increase(ocpp_command_results_total[10m])) or vector(0)) - (sum(increase(ocpp_command_results_total{status=~"(?i)accepted|unlocked|scheduled|rebootrequired|clearingcache"}[10m])) or vector(0))
        instant: true
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-conn-flapping
    title: Connection flapping (churn > 10 / 5m)
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      category: service
    annotations:
      summary: Charge-point sockets are churning (>10 disconnects in 5 min).
      action: Check network / Cloudflare idle cuts / a reboot loop.
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(increase(ocpp_connections_closed_total[5m])) or vector(0)
        instant: true
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
  - uid: ocpp-session-started
    title: Charging session started
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: info
      category: session
    annotations:
      summary: A charging session started on the live charger.
      action: Informational — no action.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `started transaction` [5m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-session-stopped
    title: Charging session ended
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: info
      category: session
    annotations:
      summary: A charging session ended on the live charger.
      action: Informational — no action.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `stopped transaction` [5m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-charger-restart
    title: Charger booted (restart / reconnect)
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: info
      category: service
    annotations:
      summary: The charger sent a BootNotification (restart or reconnect).
      action: Confirm it was expected — scheduled reset, OTA, or a reconnect. If unexpected or repeated, investigate.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `boot confirmed` [5m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: ocpp-firmware-change
    title: Firmware update in progress / installed
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: info
      category: firmware
    annotations:
      summary: The charger reported a firmware status change (update downloading / installing / installed).
      action: Verify the new firmware version and that charging resumed after the update.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        expr: sum(count_over_time({service_name="ocpp-central-system"} |~ `updated firmware status` [10m]))
        queryType: instant
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
