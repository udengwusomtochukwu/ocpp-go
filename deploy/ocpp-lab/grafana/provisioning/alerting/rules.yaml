# hyde/lab: provisioned alert rules for the OCPP lab (folder "OCPP Lab").
# Fire in Grafana Alerting UI (default contact point; add Slack/email there).
apiVersion: 1
groups:
  - orgId: 1
    name: ocpp-lab
    folder: OCPP Lab
    interval: 1m
    rules:
      - uid: ocpp-cs-down
        title: Central system down (scrape failing)
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: ocpp-central-system /metrics is not scrapeable — CS likely down.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'up{job="ocpp-central-system"}', instant: true }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
      - uid: ocpp-fault-spike
        title: Charger fault reported
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: One or more StatusNotifications carried an errorCode in the last 5m.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'sum(increase(ocpp_faults_total[5m])) or vector(0)', instant: true }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: ocpp-conn-flapping
        title: Connection flapping (churn > 10/5m)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: Charge-point sockets are churning — check network/CF idle cuts or a reboot loop.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'sum(increase(ocpp_connections_closed_total[5m])) or vector(0)', instant: true }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
      # hyde/lab: learned from the 2026-07-24/26 recurring precharge incident.
      - uid: ocpp-precharge-fault
        title: HCU precharge module fault (vendor 012900)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: The recurring HCU Precharge Module Fault (vendor 012900) fired — it aborts customer sessions mid-charge. Take the unit out of service and escalate to ZD.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({service_name="ocpp-central-system"} |~ `charger fault` |~ `012900` [10m]))'
              queryType: instant
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: ocpp-fault-storm
        title: Charger fault storm (3+ faults / 30m)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 3+ charger faults in 30 minutes — a recurring/degrading fault pattern (as in the 2026-07-24/26 precharge incident). Investigate and consider taking the unit out of service.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'sum(increase(ocpp_faults_total[30m])) or vector(0)', instant: true }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
